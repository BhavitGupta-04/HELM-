<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04060d" />
    <title>HELM — Health Copilot for Deep Space</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%2300e5c3' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%2300e5c3'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the app fails to load at all (before React starts), show the reason instead of a blank page.
      addEventListener("error", function (e) {
        var r = document.getElementById("root");
        if (r && !r.children.length) r.innerHTML = '<pre style="white-space:pre-wrap;padding:24px;color:#ffb454;font:14px monospace">HELM failed to load:\n' + String(e.message || e) + '</pre>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
